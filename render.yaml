# Render Blueprint — deploy only the VTON API (not the Vercel shop).
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: vton-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 --workers 1 app:app
    healthCheckPath: /health
    envVars:
      - key: FLUX_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://ecommerce-webpage-seven.vercel.app,http://localhost:8080
