<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleHub — Online Outfit Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <h1>StyleHub</h1>
      <p>Curated outfits for men &amp; women</p>
    </div>
    <nav class="header-nav">
      <span class="nav-link">New arrivals</span>
      <span class="nav-link">Sale</span>
    </nav>
  </header>

  <main class="container">

    <div class="gender-toggle">
      <button type="button" class="gender-btn active" data-gender="male">Men</button>
      <button type="button" class="gender-btn" data-gender="female">Women</button>
    </div>

    <div id="catalog"></div>

  </main>

  <footer class="site-footer">
    <p>Demo store — virtual try-on available on each product.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/vton-widget.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
