<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <script>
    // Old try-on page → shop with widget open
    const params = new URLSearchParams(window.location.search);
    const product = params.get("product");
    window.location.replace(
      product ? "index.html?product=" + encodeURIComponent(product) : "index.html"
    );
  </script>
</head>
<body>
  <p>Redirecting to the shop… <a href="index.html">Click here</a> if nothing happens.</p>
</body>
</html>
